[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lacuna"
version = "0.1.0"
description = "Concilia atos de contratação dos diários oficiais municipais com o PNCP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Juan Barros" }]
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyarrow>=16",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]
app = [
    "streamlit>=1.46",
    "gradio>=5,<6",
]

[project.scripts]
dxp = "dxp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dxp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/*.py" = ["E402"]
