name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,app]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - name: avaliação no dev com respostas gravadas do LLM
        if: hashFiles('data/gold/dev.jsonl') != ''
        run: |
          dxp avaliar --extrator regex --split dev
          dxp avaliar --extrator llm --split dev
